name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: message-hub-backend
  FRONTEND_IMAGE_NAME: message-hub-frontend

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Validate semantic version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(node -p "require('./backend/package.json').version")" == "$version" ]]
          [[ "$(node -p "require('./frontend/package.json').version")" == "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate production frontend URL
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_API_URL" =~ ^https://.+ ]]

  publish:
    name: Build and publish container images
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER,,}/${BACKEND_IMAGE_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --file backend/Dockerfile backend
      - name: Build and push frontend
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER,,}/${FRONTEND_IMAGE_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg "VITE_API_URL=$PRODUCTION_API_URL" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --file frontend/Dockerfile frontend
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  deploy:
    name: Deploy production
    needs: [validate-release, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_CONSOLE_URL }}
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/message-hub-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/message-hub-frontend
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PATH" ]]
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          [[ "$PRODUCTION_API_URL" =~ ^https://.+ ]]
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install --directory --mode 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Pull images and apply release
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
            BACKEND_IMAGE='${BACKEND_IMAGE,,}' \
            FRONTEND_IMAGE='${FRONTEND_IMAGE,,}' \
            IMAGE_TAG='${VERSION}' \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.release.yml pull && \
            BACKEND_IMAGE='${BACKEND_IMAGE,,}' \
            FRONTEND_IMAGE='${FRONTEND_IMAGE,,}' \
            IMAGE_TAG='${VERSION}' \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.release.yml up -d --no-build --remove-orphans"
      - name: Verify public health check
        run: curl --fail --retry 5 --retry-delay 5 "$PRODUCTION_API_URL/health"
