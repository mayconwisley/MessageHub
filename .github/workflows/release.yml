name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: message-hub-backend
  FRONTEND_IMAGE_NAME: message-hub-frontend

jobs:
  validate-release:
    name: Validate stable release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: release
        name: Validate release and tag
        shell: bash
        env:
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_IS_DRAFT" == "false" && "$RELEASE_IS_PRERELEASE" == "false" ]] || {
            echo "::error::O deploy de produção exige uma GitHub Release estável publicada."
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || {
            echo "::error::A Release publicada não está associada à referência de tag esperada."
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::A tag da Release deve seguir o formato vX.Y.Z."
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "::error::A tag $RELEASE_TAG não existe no repositório."
            exit 1
          }

          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$release_commit" == "$GITHUB_SHA" ]] || {
            echo "::error::A tag $RELEASE_TAG foi alterada após a publicação da Release."
            exit 1
          }

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || {
            echo "::error::A tag $RELEASE_TAG deve apontar para um commit pertencente à main."
            exit 1
          }

          version="${RELEASE_TAG#v}"
          backend_version="$(node -p "require('./backend/package.json').version")"
          frontend_version="$(node -p "require('./frontend/package.json').version")"
          [[ "$backend_version" == "$version" && "$frontend_version" == "$version" ]] || {
            echo "::error::A versão da tag deve ser idêntica às versões de backend/package.json e frontend/package.json."
            exit 1
          }

          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify release source
    needs: validate-release
    uses: ./.github/workflows/release-verify.yml
    with:
      commit: ${{ needs.validate-release.outputs.commit }}

  publish:
    name: Build and publish container images
    needs: [validate-release, verify-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_BASE_PATH: ${{ vars.PRODUCTION_BASE_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
      - name: Validate production frontend configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCTION_API_URL:?Configure PRODUCTION_API_URL no ambiente production}"
          : "${PRODUCTION_BASE_PATH:?Configure PRODUCTION_BASE_PATH no ambiente production}"
          [[ "$PRODUCTION_API_URL" =~ ^https://.+ ]] || {
            echo "::error::PRODUCTION_API_URL deve ser uma URL HTTPS absoluta."
            exit 1
          }
          [[ "$PRODUCTION_BASE_PATH" =~ ^/([^/]+/)*$ ]] || {
            echo "::error::PRODUCTION_BASE_PATH deve iniciar e terminar com barra, por exemplo /messagehub/."
            exit 1
          }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER,,}/${BACKEND_IMAGE_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --file backend/Dockerfile backend
      - name: Build and push frontend
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER,,}/${FRONTEND_IMAGE_NAME}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg "VITE_API_URL=$PRODUCTION_API_URL" \
            --build-arg "VITE_BASE_PATH=$PRODUCTION_BASE_PATH" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --file frontend/Dockerfile frontend
  deploy:
    name: Deploy production
    needs: [validate-release, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_CONSOLE_URL }}
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/message-hub-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/message-hub-frontend
      DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_DEPLOY_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOST: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOST }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_BASE_PATH: ${{ vars.PRODUCTION_BASE_PATH }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PATH" ]]
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" && -n "$DEPLOY_KNOWN_HOST" ]]
          [[ "$DEPLOY_HOST" != *://* && "$DEPLOY_HOST" != */* && "$DEPLOY_HOST" != *[[:space:]]* ]] || {
            echo "::error::PRODUCTION_DEPLOY_HOST deve conter somente hostname ou IP, sem protocolo, caminho ou espaços."
            exit 1
          }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || {
            echo "::error::PRODUCTION_DEPLOY_PORT deve ser uma porta numérica entre 1 e 65535."
            exit 1
          }
          [[ "$PRODUCTION_API_URL" =~ ^https://.+ ]]
          [[ "$PRODUCTION_BASE_PATH" =~ ^/([^/]+/)*$ ]]
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install --directory --mode 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi

          host_public_key="$(
            printf '%s\n' "$DEPLOY_KNOWN_HOST" | tr -d '\r' | awk '
              $1 == "ssh-ed25519" && length($2) > 0 { print $1 " " $2; exit }
              $2 == "ssh-ed25519" && length($3) > 0 { print $2 " " $3; exit }
            '
          )"
          if [[ -z "$host_public_key" ]]; then
            echo "::error::PRODUCTION_DEPLOY_KNOWN_HOST deve conter uma chave pública ED25519 válida."
            exit 1
          fi

          printf '%s %s\n' "$known_host" "$host_public_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
            echo "::error::PRODUCTION_DEPLOY_KNOWN_HOST não contém uma chave para o host e porta configurados."
            exit 1
          }
      - name: Pull images and apply release
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
            BACKEND_IMAGE='${BACKEND_IMAGE,,}' \
            FRONTEND_IMAGE='${FRONTEND_IMAGE,,}' \
            IMAGE_TAG='${VERSION}' \
            docker compose -f docker-compose.vps.yml -f docker-compose.release.yml pull && \
            BACKEND_IMAGE='${BACKEND_IMAGE,,}' \
            FRONTEND_IMAGE='${FRONTEND_IMAGE,,}' \
            IMAGE_TAG='${VERSION}' \
            docker compose -f docker-compose.vps.yml -f docker-compose.release.yml up -d --no-build --remove-orphans"
      - name: Verify public health check
        run: curl --fail --retry 5 --retry-delay 5 "$PRODUCTION_API_URL/health"
